name: Browser vault
on:
  push:
    branches: [main]
    paths: ['browser/**', '.github/workflows/browser.yml']
  pull_request:
    paths: ['browser/**', '.github/workflows/browser.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check browser/dist/app.mjs
      - run: node --test browser/vault.test.mjs
