name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (Riverpod / json_serializable)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-macos:
    name: Build macOS (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (Riverpod / json_serializable)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build macOS bundle
        run: flutter build macos --release

      # NOTE: CI builds an UNSIGNED bundle only. Developer ID code signing,
      # Apple notarization, and ticket stapling are performed manually on the
      # release artifact (see SECURITY.md -> macOS Release Checklist). Automating
      # the signing/notarization step in a tag-gated release job is tracked as
      # open release-hygiene work.
