<!DOCTYPE html>
<html lang="en">
<head>

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0a0a0a;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;

  img { width: 64px; height: 64px; margin-bottom: 1.5rem; }
  h1 { font-size: 1.75rem; font-weight: 600; margin-bottom: 0.75rem; }

</head>
<body>
  <img src="trulana-logo.png" alt="Trulana">
