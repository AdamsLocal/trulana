name: trulana
description: "Autonomous Personal API and Data Broker — local-first, privacy-centric."

# Changed from 'none' to target your GitHub Packages scoped registry
publish_to: https://pub.pkg.github.com/machine-squelch

version: 1.2.1+4

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Encrypted local database
  sqflite_sqlcipher: ^3.1.0+1

  # Platform secure storage (macOS Keychain / Android EncryptedSharedPreferences)
  flutter_secure_storage: ^9.2.4

  # Biometric authentication
  local_auth: ^2.3.0

  # Routing
  go_router: ^14.8.1

  # Local HTTP server
  shelf: ^1.4.2
  shelf_router: ^1.1.4

  # Serialization
  json_annotation: ^4.9.0

  # Utilities
  uuid: ^4.5.1
  path: ^1.9.1
  intl: ^0.19.0

  # Animation & UI
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  json_serializable: ^6.9.4

  # Testing
  mockito: ^5.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/images/trulana-icon.png
