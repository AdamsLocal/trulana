name: sovereign
description: "Autonomous Personal API and Data Broker — local-first, privacy-centric."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Encrypted local database
  sqflite_sqlcipher: ^3.1.0+1

  # Secure key storage (Secure Enclave / KeyStore)
  flutter_secure_storage: ^9.2.4

  # Biometric authentication
  local_auth: ^2.3.0

  # Routing
  go_router: ^14.8.1

  # Local HTTP server
  shelf: ^1.4.2
  shelf_router: ^1.1.4

  # Serialization
  json_annotation: ^4.9.0

  # Utilities
  uuid: ^4.5.1
  path: ^1.9.1
  intl: ^0.19.0

  # Animation & UI
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  json_serializable: ^6.9.4

  # Testing
  mockito: ^5.4.6

  # Splash screen generation
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_native_splash:
  color: "#0A0A0F"
  image: assets/images/splash.png
  android: true
  ios: true
  android_12:
    color: "#0A0A0F"
    image: assets/images/splash.png
